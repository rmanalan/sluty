[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sluty"
version = "0.1.0"
description = "Derive a 3D .cube LUT from before/after image pairs (presets, picture controls, film sims, grades)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.7",
    "tifffile>=2023.1",
    "pillow>=9.0",
]

[project.scripts]
sluty = "sluty.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["sluty"]
