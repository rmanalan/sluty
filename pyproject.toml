[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npc-to-lut"
version = "0.1.0"
description = "Convert Nikon Custom Picture Control files (.NP3/.NCP) to 3D .cube LUTs"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.0",
]

[project.scripts]
npc-to-lut = "npc_to_lut.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["npc_to_lut"]
